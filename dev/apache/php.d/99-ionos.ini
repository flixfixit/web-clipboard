; PHP limits as reported by the IONOS webhosting (PHP 8.3, cgi-fcgi)
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 50000
max_input_time = -1
memory_limit = -1
session.cookie_secure = 0

; Dev only: show errors in the browser and in the Apache error log
display_errors = On
log_errors = On
error_reporting = E_ALL
