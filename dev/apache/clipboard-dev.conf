# Local Apache vhost that mimics the IONOS webhosting setup:
# Apache 2.4 + PHP 8.3 as FastCGI (php-cgi via mod_fcgid, "Server API: cgi-fcgi"),
# .htaccess enabled. @PROJECT_DIR@ is replaced by dev/apache/setup.sh.
Define CLIPBOARD_DIR "@PROJECT_DIR@"

Listen 8081

<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot "${CLIPBOARD_DIR}"
    DirectoryIndex index.php

    # The project lives on the Windows drive (/mnt/c); sendfile/mmap are unreliable there
    EnableSendfile Off
    EnableMMAP Off

    # IONOS answers unknown paths via mod_speling ("Multiple Choices" with similar
    # file names); .htaccess switches it off again
    CheckSpelling On

    # IONOS-like PHP limits (dev/apache/php.d) on top of the distro defaults
    FcgidInitialEnv PHP_INI_SCAN_DIR ":${CLIPBOARD_DIR}/dev/apache/php.d"
    # mod_fcgid only accepts 128 KB request bodies by default; IONOS allows 64 MB
    FcgidMaxRequestLen 67108864
    FcgidIOTimeout 300
    FcgidBusyTimeout 300

    <Directory "${CLIPBOARD_DIR}">
        # Indexes stays on deliberately: the .htaccess files must protect the app
        # even on a server that allows directory listings.
        Options +ExecCGI +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # AddHandler (not SetHandler), so RemoveHandler in uploads/.htaccess works
        # the same way as on shared hosting
        AddHandler fcgid-script .php
        FcgidWrapper /usr/bin/php-cgi8.3 .php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/clipboard-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/clipboard-dev-access.log combined
</VirtualHost>
